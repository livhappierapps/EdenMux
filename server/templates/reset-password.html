<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password — EdenMux</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0e0e0f;color:#e8d5c4;font-family:Georgia,serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:100%;max-width:400px;background:#1a1a1b;border:1px solid rgba(200,75,110,.2);border-radius:16px;padding:40px 32px}
    h1{font-size:20px;letter-spacing:3px;text-transform:uppercase;text-align:center;margin-bottom:6px}
    .sub{font-size:12px;color:#a07890;text-align:center;margin-bottom:28px;letter-spacing:.5px}
    label{display:block;font-size:11px;letter-spacing:1px;color:#a07890;margin-bottom:6px;text-transform:uppercase}
    input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(200,75,110,.25);border-radius:10px;padding:12px 14px;color:#e8d5c4;font-size:14px;font-family:Georgia,serif;outline:none;margin-bottom:16px;transition:border-color .2s}
    input:focus{border-color:rgba(200,75,110,.6)}
    button{width:100%;padding:14px;background:#c84b6e;color:#fff;border:none;border-radius:10px;font-size:13px;letter-spacing:1.5px;font-family:Georgia,serif;cursor:pointer;text-transform:uppercase;margin-top:4px;transition:opacity .2s}
    button:hover{opacity:.85}
    button:disabled{opacity:.5;cursor:default}
    .msg{margin-top:16px;font-size:12px;text-align:center;padding:12px;border-radius:8px;display:none}
    .msg.error{background:rgba(200,75,110,.12);border:1px solid rgba(200,75,110,.3);color:#e8a0b4}
    .msg.success{background:rgba(75,180,110,.1);border:1px solid rgba(75,180,110,.25);color:#80e0a0}
    .back{display:block;text-align:center;margin-top:20px;font-size:11px;color:#a07890;letter-spacing:.5px;text-decoration:none}
    .back:hover{color:#e8d5c4}
    .strength{height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:-12px;margin-bottom:16px;overflow:hidden}
    .strength-bar{height:100%;width:0;transition:width .3s,background .3s;border-radius:2px}
  </style>
</head>
<body>
<div class="card">
  <h1>EdenMux</h1>
  <p class="sub">Enter a new password below</p>

  <div id="form-area">
    <label for="pw">New Password</label>
    <input type="password" id="pw" placeholder="At least 8 characters" oninput="checkStrength(this.value)" autocomplete="new-password">
    <div class="strength"><div class="strength-bar" id="bar"></div></div>

    <label for="pw2">Confirm Password</label>
    <input type="password" id="pw2" placeholder="Same password again" autocomplete="new-password">

    <button id="btn" onclick="submit()">Set New Password</button>
    <div class="msg" id="msg"></div>
  </div>

  <a href="/" class="back">← Back to EdenMux</a>
</div>

<script>
  const token = new URLSearchParams(location.search).get('token') || '';
  if (token) history.replaceState(null, document.title, location.pathname);
  if (!token) showMsg('error', 'Invalid or missing reset token. Please request a new password reset.');

  function checkStrength(pw) {
    const bar = document.getElementById('bar');
    let score = 0;
    if (pw.length >= 8) score++;
    if (pw.length >= 12) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    const colors = ['#c84b6e','#e08040','#e0c040','#60c080','#40c090'];
    bar.style.width = (score * 20) + '%';
    bar.style.background = colors[score - 1] || 'transparent';
  }

  async function submit() {
    const pw = document.getElementById('pw').value;
    const pw2 = document.getElementById('pw2').value;
    if (!pw || pw.length < 8) { showMsg('error', 'Password must be at least 8 characters.'); return; }
    if (pw !== pw2) { showMsg('error', 'Passwords don\'t match.'); return; }

    const btn = document.getElementById('btn');
    btn.disabled = true;
    btn.textContent = 'Updating...';
    hideMsg();

    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: pw }),
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        document.getElementById('form-area').style.display = 'none';
        showMsg('success', '✓ Password updated! Head back to the app and sign in with your new password.');
      } else {
        const isExpired = res.status === 400 && (data.error || '').toLowerCase().includes('expired');
        showMsg('error', data.error || 'Something went wrong. Please request a new reset link.', isExpired);
        btn.disabled = false;
        btn.textContent = 'Set New Password';
      }
    } catch {
      showMsg('error', 'Network error. Please check your connection and try again.');
      btn.disabled = false;
      btn.textContent = 'Set New Password';
    }
  }

  function showMsg(type, text, showRetry) {
    const el = document.getElementById('msg');
    el.className = 'msg ' + type;
    el.textContent = text;
    if (showRetry) {
      const btn = document.createElement('a');
      btn.href = '/';
      btn.textContent = 'Open EdenMux to request a new link →';
      btn.style.cssText = 'display:block;margin-top:10px;color:inherit;opacity:.8;font-size:12px;';
      el.appendChild(btn);
    }
    el.style.display = 'block';
  }
  function hideMsg() {
    document.getElementById('msg').style.display = 'none';
  }
</script>
</body>
</html>
